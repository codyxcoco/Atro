name: Atro
options:
  createIntermediateGroups: true
  defaultConfig: Debug
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 6.0
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
targets:
  Atro:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Atro
        excludes:
          - Resources
      - path: Atro/Resources/Assets.xcassets
        buildPhase: resources
      - path: Atro/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared
    info:
      path: Atro/Resources/Info.plist
      properties:
        CFBundleDisplayName: Atro
        UIApplicationSupportsIndirectInputEvents: true
        UIUserInterfaceStyle: Automatic
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: Atro
            CFBundleURLSchemes:
              - atro
        ITSAppUsesNonExemptEncryption: false
        NSCalendarsWriteOnlyAccessUsageDescription: Atro can add the workout title, date, duration, and notes for a planned session to Calendar when you choose to sync it.
        NSHealthShareUsageDescription: Atro can read your workouts, active energy, and exercise minutes to personalize Today and match imported workouts in Journal.
        NSHealthUpdateUsageDescription: Atro can write completed workouts that you save in Atro to the Health app when you enable workout export.
    entitlements:
      path: Atro/Resources/Atro.entitlements
      properties:
        com.apple.developer.healthkit: true
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: EventKit.framework
      - sdk: HealthKit.framework
      - sdk: UIKit.framework
      - sdk: WatchConnectivity.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codex.Atro
        PRODUCT_NAME: Atro
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Atro/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Atro/Resources/Atro.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  AtroWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: AtroWatch
      - path: Shared
    dependencies:
      - sdk: WatchConnectivity.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codex.Atro.watchkitapp
        PRODUCT_NAME: Atro Watch
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Atro
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.codex.Atro
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  AtroTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - AtroTests
    dependencies:
      - target: Atro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codex.AtroTests
        PRODUCT_NAME: AtroTests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Atro:
    build:
      targets:
        Atro: all
        AtroTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: AtroTests
    analyze:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
  AtroWatch:
    build:
      targets:
        AtroWatch: all
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
